<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HackoWatt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- App scripts (order matters: namespace → helpers → data → service → state → screens), then Alpine -->
  <script defer src="vendor/leaflet/leaflet.js"></script>
  <script defer src="vendor/chartjs/chart.umd.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/charts.js"></script>
  <script defer src="js/data/demo.js"></script>
  <script defer src="js/power.js"></script>
  <script defer src="js/services/api.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/screens/home.js"></script>
  <script defer src="js/screens/forecast.js"></script>
  <script defer src="js/screens/devices.js"></script>
  <script defer src="js/screens/settings.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body>
  <div class="phone" x-data x-cloak>
    <div class="statusbar">
      <span x-text="$store.clock.time">9:41</span>
      <span x-html="$icon('status')"></span>
    </div>

    <main class="screen">

      <!-- =============================== HOME =============================== -->
      <section x-data="homeScreen" x-show="$store.nav.screen === 'home'">
        <header class="welcome">
          <div>
            <h1>Welcome home, <span class="accent" x-text="$store.profile.name"></span></h1>
            <p class="status-line"><i class="dot green"></i><span x-text="user.status"></span></p>
          </div>
          <button class="avatar" @click="$store.nav.go('profile')" aria-label="Profile"><img src="assets/avatar.png"
              alt=""></button>
        </header>

        <!-- Energy Usage -->
        <article class="card tappable" @click="$store.nav.go('forecast')">
          <div class="card-head">
            <h2>Energy Usage</h2>
            <div class="legend">
              <span><i class="dot orange"></i>Actual</span>
              <span><i class="dot grey"></i>Forecast</span>
            </div>
          </div>
          <p class="muted">Active tracking &amp; forecast</p>
          <div class="chart"><canvas x-chart="overviewSpec"></canvas></div>
          <div class="axis">
            <template x-for="label in overview?.labels"><span x-text="label"></span></template>
          </div>
          <div class="card-link"><span>Details &amp; predictions</span><span x-html="$icon('chevron')"></span></div>
        </article>

        <!-- Energy Prices -->
        <article class="card">
          <h2>Energy Prices</h2>
          <p class="muted">Time-of-use rates</p>
          <div class="tariff">
            <template x-for="seg in tariff">
              <div class="tariff-seg" :style="`flex:${seg.to - seg.from}`">
                <div class="tariff-fill" :class="[seg.tone, seg.to - seg.from <= 2 && 'narrow']">
                  <span class="price" x-text="$euro(seg.price)"></span>
                </div>
              </div>
            </template>
            <span class="tariff-marker" :style="nowStyle"></span>
          </div>
          <div class="tariff-axis">
            <template x-for="seg in tariff">
              <span :style="`flex:${seg.to - seg.from}`" x-text="tariffLabel(seg)"></span>
            </template>
          </div>
        </article>

        <!-- Peak Demand Hours -->
        <article class="card">
          <h2>Your Peak Demand Hours</h2>
          <p class="muted" x-text="peak?.text"></p>
          <div class="chart bars"><canvas x-chart="peakSpec"></canvas></div>
          <div class="axis-abs">
            <template x-for="t in peakAxis">
              <span :class="t.cls" :style="`left:${t.at}%`" x-text="t.text"></span>
            </template>
          </div>
          <div class="legend bottom">
            <span><i class="square orange"></i><span x-text="peakLabel && `Peak (${peakLabel} h)`"></span></span>
            <span><i class="square grey"></i>Off-peak</span>
          </div>
        </article>

        <!-- Status tiles -->
        <div class="tiles scroll" :class="{ 'fade-left': fade.left, 'fade-right': fade.right }"
          x-init="$nextTick(() => onTilesScroll($el))" @scroll.passive="onTilesScroll($event.target)">
          <template x-for="tile in tiles">
            <div class="tile" :class="{ highlight: tile.highlight, tappable: tile.target }"
              @click="tile.target && $store.nav.go(tile.target)">
              <div class="tile-top">
                <span class="icon-bubble" :class="{ warm: tile.highlight }" x-html="$icon(tile.icon)"></span>
                <span class="tile-state" :class="{ accent: tile.highlight }" x-text="tile.state"></span>
              </div>
              <div class="tile-value" x-text="tile.value"></div>
              <div class="muted" x-text="tile.label"></div>
            </div>
          </template>
        </div>
      </section>

      <!-- ============================== FORECAST ============================== -->
      <section x-data="forecastScreen" x-show="$store.nav.screen === 'forecast'">
        <header class="topbar left">
          <h1>Forecast</h1>
        </header>

        <div class="segmented" :style="`--i:${ranges.indexOf(range)};--n:${ranges.length}`">
          <span class="thumb"></span>
          <template x-for="r in ranges">
            <button :class="{ active: range === r }" @click="setRange(r)" x-text="r"></button>
          </template>
        </div>

        <article class="card profile">
          <h2 x-text="data?.title"></h2>
          <p class="muted" x-text="data?.subtitle"></p>
          <div class="chart tall">
            <div class="stripes"></div>
            <canvas x-chart="profileSpec"></canvas>
          </div>
          <div class="axis">
            <template x-for="label in data?.labels"><span x-text="label"></span></template>
          </div>
        </article>

        <!-- Devices, grouped by how the forecast models them -->
        <div x-data="deviceList" class="device-groups">
          <div class="devices-head">
            <h3 class="section-title">Devices</h3>
            <span class="muted" x-text="`${format(total)} now · ${activeCount} of ${devices.length} running`"></span>
          </div>
          <template x-for="group in groups">
            <article class="card room">
              <div class="room-head">
                <h2><i class="dot orange"></i><span x-text="group.title"></span></h2>
                <span class="muted" x-text="`${format(groupTotal(group))} now`"></span>
              </div>
              <p class="muted group-hint" x-text="group.hint"></p>
              <template x-for="device in group.devices">
                <div class="device">
                  <span class="icon-bubble square warm" x-html="$icon(device.icon)"></span>
                  <div class="device-info">
                    <div class="device-name" x-text="device.name"></div>
                    <span class="muted" x-text="device.room"></span>
                  </div>
                  <span class="watts" :class="{ off: !draw(device) }"
                    x-text="draw(device) ? format(draw(device)) : 'Off'"></span>
                </div>
              </template>
            </article>
          </template>
        </div>
        <p class="footnote" x-text="forecastNote"></p>
      </section>

      <!-- =============================== PROFILE =============================== -->
      <section x-data="settingsScreen" x-show="$store.nav.screen === 'profile'" class="settings">
        <header class="profile-head">
          <img class="profile-avatar" src="assets/avatar.png" alt="">
          <div>
            <input class="inline-edit name" x-model="$store.profile.name" @change="$store.profile.save()"
              aria-label="Name" autocomplete="off" spellcheck="false">
            <input class="inline-edit email" type="email" x-model="$store.profile.email" @change="$store.profile.save()"
              aria-label="Email" autocomplete="off" spellcheck="false">
          </div>
        </header>

        <h3 class="settings-title">Settings</h3>
        <button class="setting-row" @click="editingTime = !editingTime">
          <span class="setting-icon" x-html="$icon('clock')"></span>
          <span class="setting-text"><strong>Current Time</strong><span x-text="clock.label"></span></span>
          <span class="chevron" :class="{ open: editingTime }" x-html="$icon('chevron')"></span>
        </button>
        <input class="time-input" type="datetime-local" x-show="editingTime" x-effect="document.activeElement !== $el && ($el.value = clock.iso)"
          @change="clock.set($event.target.value)" aria-label="Current time">
        <button class="setting-row" @click="editingLocation = !editingLocation">
          <span class="setting-icon" x-html="$icon('pin')"></span>
          <span class="setting-text"><strong>Location</strong><span x-text="$store.profile.location.name"></span></span>
          <span class="chevron" :class="{ open: editingLocation }" x-html="$icon('chevron')"></span>
        </button>
        <div class="location-editor" x-show="editingLocation">
          <input class="time-input" type="search" placeholder="Search a city…" x-model="query"
            @input.debounce.350ms="search()" aria-label="Search location">
          <ul class="place-list" x-show="places.length || searchError">
            <template x-for="p in places">
              <li><button @click="pick(p)" x-text="p.name"></button></li>
            </template>
            <li class="muted" x-show="searchError" x-text="searchError"></li>
          </ul>
          <div class="map" x-ref="map"></div>
        </div>

        <h3 class="settings-title data">Data Management</h3>
        <button class="btn primary"><span x-html="$icon('refresh')"></span>Generate 30-Day Mock Data</button>
        <button class="btn outline"><span x-html="$icon('upload')"></span>Upload Data</button>
        <p class="settings-hint">Generate realistic energy consumption data or upload your own CSV file</p>
      </section>
    </main>

    <nav class="tabbar">
      <template x-for="tab in $store.nav.tabs">
        <button :class="{ active: $store.nav.activeTab === tab.id }" @click="$store.nav.go(tab.id)">
          <span x-html="$icon(tab.id)"></span>
          <span x-text="tab.label"></span>
        </button>
      </template>
      <div class="home-indicator"></div>
    </nav>
  </div>
</body>

</html>
